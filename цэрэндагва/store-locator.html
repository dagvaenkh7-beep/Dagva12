<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дэлгүүр & Эвент хайх | Fashion Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

/* ===== Promo bar ===== */
.promo-bar{
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding:12px 20px;
    font-size:14px;
    color:#0b2c68;
    position:relative;
}

.promo-bar a{
    color:#0b2c68;
    font-weight:bold;
    text-decoration:underline;
}

/* ===== Main nav ===== */
.main-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    background:white;
    border-bottom:1px solid #eee;
}

.main-nav .logo{
    font-size:26px;
    font-weight:bold;
    color:#0b2c68;
    text-decoration:none;
}

.main-nav .nav-links{
    display:flex;
    gap:36px;
    list-style:none;
}

.main-nav .nav-links a{
    color:#0b2c68;
    text-decoration:none;
    font-size:17px;
}

.main-nav .nav-links a:hover{
    text-decoration:underline;
}

.main-nav .nav-icons span{
    font-size:20px;
    color:#0b2c68;
    margin-left:22px;
}

/* ===== Locator ===== */
.locator-header{
    padding:26px 60px 10px;
}

.locator-header h1{
    color:#0b2c68;
    font-size:26px;
    margin-bottom:22px;
}

.locator-controls{
    display:flex;
    align-items:flex-end;
    gap:26px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

.field-group label{
    display:block;
    font-size:14px;
    color:#333;
    margin-bottom:8px;
}

.field-group select,
.field-group input{
    border:1px solid #ccc;
    border-radius:4px;
    padding:12px 14px;
    font-size:15px;
    color:#333;
}

.field-group.location input{
    width:280px;
}

.field-group.radius select{
    width:90px;
}

.btn-primary{
    background:#0b2c68;
    color:white;
    border:none;
    padding:14px 26px;
    font-size:15px;
    font-weight:bold;
    letter-spacing:.5px;
    cursor:pointer;
    border-radius:4px;
}

.btn-primary:hover{
    background:#051c45;
}

.btn-outline{
    background:white;
    color:#0b2c68;
    border:2px solid #0b2c68;
    padding:12px 26px;
    font-size:15px;
    font-weight:bold;
    letter-spacing:.5px;
    cursor:pointer;
    border-radius:4px;
}

.btn-outline:hover{
    background:#f0f4fa;
}

.category-checks{
    display:flex;
    flex-wrap:wrap;
    gap:26px;
    margin-bottom:24px;
}

.category-checks label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    color:#333;
    cursor:pointer;
}

.map-wrap{
    position:relative;
}

.map-wrap iframe{
    width:100%;
    height:520px;
    border:0;
    display:block;
}

.results-bar{
    background:#0b2c68;
    color:white;
    text-align:center;
    padding:16px;
    font-size:16px;
    margin:0 60px;
}

.locator-footer-space{
    height:60px;
}

@media (max-width:768px){
    .main-nav{ padding:14px 20px; flex-wrap:wrap; gap:14px; }
    .main-nav .nav-links{ order:3; width:100%; justify-content:center; gap:18px; font-size:15px; }
    .locator-header{ padding:20px 20px 10px; }
    .field-group.location input{ width:100%; }
    .locator-controls{ flex-direction:column; align-items:stretch; }
    .results-bar{ margin:0 20px; }
}

</style>

</head>
<body>

<div class="promo-bar">
    Хямдралтай шинэ бараа хүлээж байна. <a href="index.html">Дэлгүүр хэсэх</a>
</div>

<nav class="main-nav">
    <a href="index.html" class="logo">Fashion Shop</a>

    <ul class="nav-links">
        <li><a href="index.html">Shop</a></li>
        <li><a href="#">New</a></li>
        <li><a href="#">Sale</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="nav-icons">
        <span>&#128269;</span>
        <span>&#128100;</span>
        <span>&#128722;</span>
    </div>
</nav>

<div class="locator-header">
    <h1>Дэлгүүр & Эвент хайх</h1>

    <div class="locator-controls">
        <div class="field-group">
            <label>Улс</label>
            <select id="countrySelect">
                <option value="">Улс сонгох</option>
                <option value="mn">Монгол</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
            </select>
        </div>

        <div class="field-group location">
            <label>Байршил</label>
            <input type="text" id="locationInput" value="Улаанбаатар">
        </div>

        <div class="field-group radius">
            <label>Радиус</label>
            <select id="radiusSelect">
                <option value="5">5</option>
                <option value="15" selected>15</option>
                <option value="30">30</option>
                <option value="50">50</option>
            </select>
        </div>

        <button class="btn-primary" onclick="findEvents()">ЭВЕНТ ХАЙХ</button>
        <button class="btn-outline" onclick="viewStores()">Дэлгүүр харах</button>
    </div>

    <div class="category-checks">
        <label><input type="checkbox"> Эрэгтэй</label>
        <label><input type="checkbox"> Эмэгтэй</label>
        <label><input type="checkbox"> Хүүхэд</label>
        <label><input type="checkbox"> Гутал</label>
        <label><input type="checkbox"> Хувцас</label>
        <label><input type="checkbox"> Дагалдах хэрэгсэл</label>
        <label><input type="checkbox"> Волейбол</label>
        <label><input type="checkbox"> Спорт</label>
    </div>
</div>

<div class="map-wrap">
    <iframe
        src="https://www.google.com/maps?q=Ulaanbaatar,Mongolia&output=embed"
        allowfullscreen
        loading="lazy">
    </iframe>
</div>

<div class="results-bar" id="resultsBar">Хуудас 0-с 0 харуулж байна</div>

<div class="locator-footer-space"></div>

<script>
function findEvents(){
    document.getElementById("resultsBar").innerHTML =
        "Одоогоор энэ байршилд эвент олдсонгүй.";
}

function viewStores(){
    document.getElementById("resultsBar").innerHTML =
        "Одоогоор энэ байршилд дэлгүүр олдсонгүй.";
}
</script>

</body>
</html>
